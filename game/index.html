<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall Duel — a card battler</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #14161c;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    width: min(1280px, 100vw);
    height: min(800px, 100vh);
    aspect-ratio: 1280 / 800;
    display: block;
    cursor: pointer;
    background: #173d27;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
